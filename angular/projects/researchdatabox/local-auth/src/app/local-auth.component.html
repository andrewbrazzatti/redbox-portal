<!-- ngIf is needed so init completes and view has all the information it needs -->
@if (isReady) {
  <div class="col-md-offset-5 col-md-3" >
    <div class="bento-card mb-4">
      <div class="card-body p-4">
        <h4 class="fw-semibold mb-4 text-center">{{ 'local-creds-header' | i18next }}</h4>
        <div class="form-login">
          <form [formGroup]="form" (ngSubmit)='onLogin($event)'>
            <div class="mb-3">
              <input type="text" id="username" class="form-control" [placeholder]="'local-creds-input-username-label' | i18next" formControlName="username" [attr.aria-label]="'local-creds-input-username-label' | i18next" autocomplete="off"/>
            </div>
            <div class="mb-4">
              <input type="password" id="password" class="form-control" [placeholder]="'local-creds-input-password-label' | i18next" formControlName="password" [attr.aria-label]="'local-creds-input-password-label' | i18next" autocomplete="off"/>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="isLoginDisabled" [class.disabled]="isLoginDisabled">{{ 'local-auth-login' | i18next }} <i class="fa fa-sign-in ms-2"></i></button>
            </div>
            @if (loginMessage != null) {
              <div class="alert alert-danger mt-3 mb-0">
                {{loginMessage}}
              </div>
            }
          </form>
        </div>
      </div>
    </div>
  </div>
}
